<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Babylon.js Character Demo</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script>
        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            new BABYLON.HemisphericLight('light', new BABYLON.Vector3(0, 1, 0), scene);
            BABYLON.MeshBuilder.CreateGround('ground', { width: 10, height: 10 }, scene);

            // Create a more rounded body
            const body = BABYLON.MeshBuilder.CreateCylinder('body', { diameter: 0.8, height: 1.5 }, scene);
            body.position.y = 0.75;

            // Spherical head
            const head = BABYLON.MeshBuilder.CreateSphere('head', { diameter: 0.8 }, scene);
            head.position.y = 1.5 + 0.4;
            head.parent = body;

            // Eye and laser
            const eye = BABYLON.MeshBuilder.CreateSphere('eye', { diameter: 0.15 }, scene);
            eye.position = new BABYLON.Vector3(0.25, 0, -0.4); // front right side
            eye.parent = head;
            eye.material = new BABYLON.StandardMaterial('eyeMat', scene);
            eye.material.emissiveColor = new BABYLON.Color3(1, 0, 0);

            const laser = BABYLON.MeshBuilder.CreateCylinder('laser', { diameter: 0.05, height: 5 }, scene);
            laser.rotation.x = Math.PI / 2;
            laser.position = new BABYLON.Vector3(0.25, 0, -2.5);
            laser.parent = head;
            laser.material = new BABYLON.StandardMaterial('laserMat', scene);
            laser.material.emissiveColor = new BABYLON.Color3(1, 0, 0);

            // Simple arms
            const leftArm = BABYLON.MeshBuilder.CreateCylinder('leftArm', { diameter: 0.2, height: 1 }, scene);
            leftArm.position = new BABYLON.Vector3(-0.6, 0.5, 0);
            leftArm.rotation.z = Math.PI / 2;
            leftArm.parent = body;
            const rightArm = leftArm.clone('rightArm');
            rightArm.position.x = 0.6;

            const camera = new BABYLON.FollowCamera('camera', new BABYLON.Vector3(0, 2, -5), scene);
            camera.lockedTarget = body;
            camera.radius = 5;
            camera.heightOffset = 2;
            camera.rotationOffset = 180;
            camera.attachControl(canvas, true);

            return scene;
        };

        const scene = createScene();
        engine.runRenderLoop(() => scene.render());
        window.addEventListener('resize', () => engine.resize());
    </script>
</body>
</html>
