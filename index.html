<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Babylon.js Character Demo</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script>
        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            new BABYLON.HemisphericLight('light', new BABYLON.Vector3(0, 1, 0), scene);
            BABYLON.MeshBuilder.CreateGround('ground', { width: 10, height: 10 }, scene);

            const body = BABYLON.MeshBuilder.CreateBox('body', { width: 1, height: 1.5, depth: 0.5 }, scene);
            body.position.y = 0.75;

            const head = BABYLON.MeshBuilder.CreateBox('head', { size: 0.6 }, scene);
            head.position.y = 1.5 + 0.3;
            head.parent = body;

            const camera = new BABYLON.FollowCamera('camera', new BABYLON.Vector3(0, 2, -5), scene);
            camera.lockedTarget = body;
            camera.radius = 5;
            camera.heightOffset = 2;
            camera.rotationOffset = 180;
            camera.attachControl(canvas, true);

            return scene;
        };

        const scene = createScene();
        engine.runRenderLoop(() => scene.render());
        window.addEventListener('resize', () => engine.resize());
    </script>
</body>
</html>
